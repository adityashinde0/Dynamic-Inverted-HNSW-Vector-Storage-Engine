[package]
name = "storage-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
crc32fast = "1.4"
byteorder = "1.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
rand = "0.8"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tonic = "0.12"
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "storage_server"
path = "src/bin/server.rs"

[[bin]]
name = "storage_benchmark"
path = "src/bin/benchmark.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
